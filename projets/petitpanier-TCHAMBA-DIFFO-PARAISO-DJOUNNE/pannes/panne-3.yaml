apiVersion: apps/v1
kind: Deployment
metadata:
  name: promo-3
spec:
  replicas: 2
  selector:
    matchLabels: { app: promo-3 }
  template:
    metadata:
      labels: { app: promo-3 }
    spec:
      containers:
        - name: web
          image: petitpanier:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: promo-3
spec:
  selector: { app: promo-3 }
  ports:
    - port: 8080
      targetPort: 8080
